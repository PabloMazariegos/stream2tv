<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-192.png">
<title>stream2tv</title>
<style>
/* Oscuro y limpio: sin cajas, un solo color de estado (el rojo de "en vivo")
   y los logos de cada plataforma como unico toque de color.
   Sin fuentes externas: el panel tiene que andar aunque no haya internet. */
:root {
  color-scheme: dark;
  --bg: #0c0c0e;
  --ink: #f4f4f5;
  --muted: #8e8e98;
  --tenue: #66666f;
  --line: #222226;
  --borde: #2a2a30;
  --campo: #18181b;
  --vivo: #ff5c61;
  --ambar: #e8b45a;
  --ok: #3fcf7f;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
/* Sin esto, una clase con display gana sobre el atributo hidden. */
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 14px/1.45 var(--sans);
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 480px; margin: 0 auto; display: grid; gap: 30px; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
svg { display: block; flex: 0 0 auto; }

.top { display: flex; justify-content: space-between; align-items: center; }
.marca { font-weight: 650; font-size: 15px; letter-spacing: -0.01em; }
.con { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.con i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.con.off i { background: var(--vivo); }

/* ---------- lo que esta en la TV ---------- */
.ahora { display: grid; gap: 4px; }
.donde { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titulo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.canal { font-size: 28px; line-height: 1.15; font-weight: 650; letter-spacing: -0.02em; overflow-wrap: anywhere; min-width: 0; }
.vacio { font-size: 20px; font-weight: 600; color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.meta.error { color: var(--vivo); }
.punto { width: 8px; height: 8px; border-radius: 50%; background: var(--vivo); flex: 0 0 auto; }
.espera { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: latir 1.1s ease-in-out infinite; }
.meta.reconectando { color: var(--ambar); }
.meta.reconectando .espera { background: var(--ambar); }
@keyframes latir { 50% { opacity: .25; } }
.sub { font-size: 12px; color: var(--muted); }
.sub.tenue { color: var(--tenue); }
.botones { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 10px; }
.botones.solo { grid-template-columns: 1fr; }
.sec-btn { height: 44px; border-radius: 10px; border: 1px solid var(--borde); font-weight: 600; }
.sec-btn.icono { width: 44px; font-size: 17px; }
.primario { height: 44px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 600; padding: 0 18px; }

/* ---------- listas ---------- */
.bloque { display: grid; gap: 6px; }
.cab { display: flex; justify-content: space-between; align-items: baseline; }
.cab h2 { margin: 0; font-size: 14px; font-weight: 600; }
.accion { font-size: 13px; color: var(--muted); min-height: 32px; }
.fila {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
  min-height: 46px; border-top: 1px solid var(--line); width: 100%; text-align: left;
}
.lista > :first-child, #favs > :first-child, #favs:empty + .otro { border-top: 0; }
.n { display: flex; align-items: center; gap: 12px; min-width: 0; }
.n span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n small { display: block; font-size: 11px; color: var(--tenue); }
/* Fila de TV: el toque elige la TV; el lapiz abre la hoja para renombrarla. */
.fila-tv { display: flex; align-items: center; border-top: 1px solid var(--line); }
.tv-sel { flex: 1; min-width: 0; min-height: 52px; display: grid; grid-template-columns: minmax(0, 1fr) 28px; align-items: center; text-align: left; }
.tv-sel .check { text-align: center; }
.lapiz { width: 44px; height: 44px; color: var(--muted); display: grid; place-items: center; flex: 0 0 auto; }

/* Hoja que sube desde abajo para ponerle nombre a una TV. */
.velo { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .55); }
.hoja {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 520px; margin: 0 auto;
  background: #17171a; border-radius: 22px 22px 0 0;
  padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 28px);
  display: flex; flex-direction: column; gap: 18px; animation: subir .2s ease-out;
}
@keyframes subir { from { transform: translateY(100%); } }
.asa { align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3a3a40; }
.hoja-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hoja h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.hoja-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.hoja input {
  height: 50px; border: 1.5px solid var(--ink); border-radius: 12px; background: #0f0f12;
  padding: 0 14px; font-size: 17px; outline: none; width: 100%;
}
.hoja input::placeholder { color: var(--tenue); }
.sugerencias { display: flex; flex-wrap: wrap; gap: 8px; }
.sugerencia { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--borde); font-size: 13px; }
.sugerencia.activa { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.guardar { height: 50px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 15px; }
.texto-btn { font-size: 13px; color: var(--muted); min-height: 32px; }
.en-tv, .vivos { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--vivo); white-space: nowrap; }
.en-tv i, .vivos i { width: 6px; height: 6px; border-radius: 50%; background: var(--vivo); flex: 0 0 auto; }
.vivos { color: var(--muted); font-variant-numeric: tabular-nums; }
.fila.con-titulo { min-height: 54px; }
/* De que se trata el stream: tenue, para que mande el nombre del canal. */
.n .tit { display: block; margin-top: 1px; font-size: 11px; line-height: 1.3; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila.off .n { color: var(--muted); }
.fila.off svg { opacity: .45; }
.offline { font-size: 12px; color: var(--muted); }
.quitar { font-size: 13px; color: var(--vivo); }
.check { font-size: 15px; }

/* La ultima fila de "Que ver": escribir otro canal sin salir de la lista. */
.otro { display: flex; align-items: center; gap: 12px; min-height: 50px; border-top: 1px solid var(--line); }
.otro input {
  /* 16px a proposito: con menos, el iPhone hace zoom al tocar el campo. */
  flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; padding: 0;
  font-size: 16px; outline: none;
}
.otro input::placeholder { color: var(--muted); }
.plat { position: relative; display: flex; align-items: center; gap: 5px; height: 44px; padding: 0 2px; color: var(--muted); font-size: 10px; cursor: pointer; }
.plat select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
.plat:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.ir { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.ir:disabled { opacity: .35; cursor: default; }

details.log summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 6px 0; }
details.log summary::-webkit-details-marker { display: none; }
details.log summary::after { content: " ▾"; }
details.log[open] summary::after { content: " ▴"; }
.log-lineas { display: grid; gap: 6px; padding-top: 6px; font-size: 12px; color: var(--muted); }
.log-lineas b { font-weight: 400; color: var(--ink); }
.log-lineas .error b { color: var(--vivo); }

.centro { display: grid; gap: 10px; justify-items: start; padding-top: 18vh; }
.centro h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
.centro p { margin: 0; color: var(--muted); font-size: 14px; max-width: 34ch; }
.centro .primario { margin-top: 10px; }
.cargando { color: var(--muted); font-size: 13px; }

.aviso {
  position: fixed; left: 20px; right: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  max-width: 480px; margin: 0 auto; background: var(--campo); border: 1px solid var(--borde);
  border-radius: 12px; padding: 12px 14px; font-size: 13px;
}

@media (prefers-reduced-motion: reduce) { .espera, .hoja { animation: none; } }
</style>
</head>
<body>
<main id="app">
  <div class="top">
    <span class="marca">stream2tv</span>
    <span class="con off" id="con"><i></i><span id="con-texto">Conectando…</span></span>
  </div>

  <div id="especial"><p class="cargando">Conectando con la laptop…</p></div>

  <div id="contenido" hidden style="display: grid; gap: 30px">
    <section id="ahora" class="ahora"></section>

    <section class="bloque">
      <div class="cab"><h2>Qué ver</h2><button class="accion" type="button" data-accion="editar" id="btn-editar">Editar</button></div>
      <div class="lista">
        <div id="favs"></div>
        <form class="otro" id="form">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--muted)"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          <input type="text" id="canal" placeholder="Otro canal o link" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="Otro canal o link">
          <button class="ir" type="submit" id="btn-ir" aria-label="Reproducir" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          </button>
          <label class="plat" title="Plataforma">
            <span id="logo-form"></span>▾
            <select id="plat" aria-label="Plataforma">
              <option value="kick">Kick</option>
              <option value="twitch">Twitch</option>
              <option value="youtube">YouTube</option>
            </select>
          </label>
        </form>
      </div>
    </section>

    <section class="bloque">
      <div class="cab"><h2>TV</h2><button class="accion" type="button" data-accion="buscar" id="btn-buscar">Buscar</button></div>
      <div class="lista" id="tvs"></div>
    </section>

    <details class="log"><summary>Actividad</summary><div class="log-lineas" id="log-lineas"></div></details>
  </div>
</main>
<div class="aviso" id="aviso" role="status" hidden></div>

<div class="velo" id="velo" hidden></div>
<form class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden>
  <div class="asa" aria-hidden="true"></div>
  <div class="hoja-cab">
    <div>
      <h2 id="hoja-titulo">Nombre de la TV</h2>
      <div class="hoja-sub" id="hoja-sub"></div>
    </div>
    <button class="texto-btn" type="button" data-hoja="cancelar">Cancelar</button>
  </div>
  <input type="text" id="hoja-nombre" maxlength="40" autocomplete="off" enterkeyhint="done" aria-label="Nombre">
  <div class="sugerencias" id="sugerencias">
    <button class="sugerencia" type="button">Sala</button>
    <button class="sugerencia" type="button">Cuarto</button>
    <button class="sugerencia" type="button">Comedor</button>
    <button class="sugerencia" type="button">Oficina</button>
  </div>
  <button class="guardar" type="submit">Guardar</button>
  <button class="texto-btn" type="button" data-hoja="fabrica" id="hoja-fabrica">Volver al nombre de fábrica</button>
</form>

<script>
(function () {
  "use strict";
  var NOMBRE = { kick: "Kick", twitch: "Twitch", youtube: "YouTube" };
  var ARRANCANDO = { verificando: 1, enviando: 1 };
  // Fases en las que el canal sigue "en la TV" aunque no este reproduciendo justo ahora.
  var EN_TV = { reproduciendo: 1, reconectando: 1, verificando: 1, enviando: 1 };
  var s = null;            // ultimo estado del Controlador
  var log = [];
  var conectado = false;
  var sinAcceso = false;
  var editando = false;
  var hojaUdn = null;      // TV que se esta renombrando en la hoja
  var platForm = null;     // plataforma elegida para "Otro canal"

  // Logos chicos de cada plataforma, el unico toque de color del panel.
  var LOGOS = {
    kick: '<rect width="24" height="24" rx="5" fill="#53FC18"></rect><path d="M6 5h4v4h2V7h2V5h4v6h-2v2h2v6h-4v-2h-2v-2h-2v4H6z" fill="#000"></path>',
    twitch: '<path fill="#9146FF" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"></path>',
    youtube: '<rect x="1" y="4.5" width="22" height="15" rx="4.5" fill="#FF0033"></rect><path d="M10 8.8v6.4l5.6-3.2z" fill="#fff"></path>'
  };
  function logo(plat, tam) {
    if (!LOGOS[plat]) return "";
    return '<svg width="' + tam + '" height="' + tam + '" viewBox="0 0 24 24" role="img" aria-label="' + NOMBRE[plat] + '">' + LOGOS[plat] + '</svg>';
  }

  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(id) { return document.getElementById(id); }

  var avisoTimer = null;
  function avisar(texto) {
    var a = $("aviso");
    a.textContent = texto;
    a.hidden = false;
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function () { a.hidden = true; }, 3500);
  }

  function pedir(ruta, cuerpo) {
    return fetch(ruta, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-Stream2tv": "1" },
      body: JSON.stringify(cuerpo || {})
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (datos) {
        if (r.status === 401) { sinAcceso = true; render(); }
        else if (!r.ok) avisar(datos.error || "La laptop no pudo hacerlo.");
        else if (datos.ok === false && datos.motivo) avisar(datos.motivo);
        return datos;
      });
    }).catch(function () { avisar("No hay conexión con la laptop."); });
  }

  function tvNombre() {
    if (!s || !s.tv) return "";
    var tv = s.tvs.filter(function (t) { return t.udn === s.tv; })[0];
    return tv ? tv.nombre : "";
  }
  function mismoCanal(a, b) { return String(a).toLowerCase() === String(b).toLowerCase(); }
  // Un favorito guardado como link se muestra con el nombre del canal.
  function nombreVisible(canal) {
    var m = /^https?:\/\/(?:www\.|m\.)?(?:twitch\.tv|kick\.com)\/([^\/?#]+)\/?$/i.exec(canal) ||
      /^https?:\/\/(?:www\.|m\.)?youtube\.com\/@([^\/?#]+)(?:\/live)?\/?$/i.exec(canal);
    return m ? m[1] : canal;
  }
  function claveVivo(f) { return f.plataforma + ":" + String(f.canal).trim().toLowerCase(); }
  // 235411 -> "235 mil", 11437 -> "11,4 mil": igual que en la TUI.
  function espectadores(n) {
    if (n == null) return "";
    if (n < 1000) return String(n);
    if (n < 100000) return (n / 1000).toFixed(1).replace(/\.0$/, "").replace(".", ",") + " mil";
    if (n < 1000000) return Math.floor(n / 1000) + " mil";
    return (n / 1000000).toFixed(1).replace(/\.0$/, "").replace(".", ",") + " M";
  }
  // Los que estan en vivo primero; dentro de cada grupo, el orden en que se agregaron.
  function favoritosOrdenados() {
    var vivo = s.en_vivo || {};
    var pares = s.favoritos.map(function (f, i) { return { f: f, i: i, e: vivo[claveVivo(f)] || null }; });
    return pares.filter(function (p) { return p.e && p.e.vivo; })
      .concat(pares.filter(function (p) { return !(p.e && p.e.vivo); }));
  }
  function esFavorito(canal, plat) {
    return s.favoritos.some(function (f) { return mismoCanal(f.canal, canal) && f.plataforma === plat; });
  }
  function minutos() {
    if (!s.desde) return null;
    return Math.max(0, Math.floor((Date.now() - new Date(s.desde).getTime()) / 60000));
  }

  // Cada seccion se reescribe solo si su HTML cambio: el campo de texto
  // nunca se toca, asi el teclado del celular no se cierra mientras escribis.
  var cache = {};
  function poner(id, html) {
    if (cache[id] === html) return;
    cache[id] = html;
    $(id).innerHTML = html;
  }

  function tarjetaAhora() {
    var donde = '<div class="donde">Ahora en ' + esc(tvNombre() || "ninguna TV") + '</div>';
    if (s.fase === "libre" || s.fase === "buscando" || !s.canal) {
      return donde + '<div class="vacio">' + (s.fase === "buscando" ? "Buscando TVs…" : "Nada en la TV") + '</div>' +
        '<div class="sub">Elegí un canal de la lista o escribí otro.</div>';
    }
    var titulo = '<div class="titulo">' + logo(s.plataforma, 24) + '<span class="canal">' + esc(s.canal) + '</span></div>';
    var meta, sub = "", botones = "";
    if (s.fase === "reproduciendo") {
      var m = minutos();
      var partes = ["En vivo"];
      if (m !== null) partes.push(m === 0 ? "recién empezó" : m + " min");
      if (s.anuncios) partes.push(s.anuncios === 1 ? "1 anuncio filtrado" : s.anuncios + " anuncios filtrados");
      meta = '<div class="meta"><i class="punto"></i>' + partes.join(" · ") + '</div>';
      var guardar = !esFavorito(s.canal, s.plataforma);
      botones = '<div class="botones' + (guardar ? "" : " solo") + '"><button class="sec-btn" type="button" data-accion="detener">Detener</button>' +
        (guardar ? '<button class="sec-btn icono" type="button" data-accion="guardar" aria-label="Guardar en Qué ver">☆</button>' : "") + '</div>';
    } else if (s.fase === "reconectando") {
      // El mensaje viene como "Reconectando... intento 2 de 5".
      var intento = /intento (\d+ de \d+)/.exec(s.mensaje || "");
      meta = '<div class="meta reconectando"><i class="espera"></i>Reconectando…' + (intento ? " intento " + intento[1] : "") + '</div>';
      sub = '<div class="sub tenue">' + esc(NOMBRE[s.plataforma] || "El sitio") + ' dejó de responder. La TV sigue conectada y vuelve sola.</div>';
      botones = '<div class="botones solo"><button class="sec-btn" type="button" data-accion="detener">Detener</button></div>';
    } else if (s.fase === "error") {
      meta = '<div class="meta error">' + esc(s.mensaje) + '</div>';
      sub = '<div class="sub">Probá con otro canal o volvé más tarde.</div>';
    } else {
      var texto = s.fase === "verificando" ? "Verificando en " + (NOMBRE[s.plataforma] || "el sitio") + "…"
        : s.fase === "enviando" ? "Abriendo en la TV…" : "Deteniendo…";
      meta = '<div class="meta"><i class="espera"></i>' + texto + '</div>';
      if (s.fase !== "deteniendo") botones = '<div class="botones solo"><button class="sec-btn" type="button" data-accion="detener">Cancelar</button></div>';
    }
    return donde + titulo + meta + sub + botones;
  }

  function renderConexion() {
    $("con").className = "con" + (conectado && !sinAcceso ? "" : " off");
    $("con-texto").textContent = sinAcceso ? "Sin acceso" : (conectado ? "Conectado" : "Sin conexión");
  }

  function renderLog() {
    poner("log-lineas", log.slice(-8).reverse().map(function (l) {
      return '<div class="' + esc(l.nivel) + '">' + esc(l.hora) + ' <b>' + esc(l.texto) + '</b></div>';
    }).join("") || "<div>Sin actividad todavía.</div>");
  }

  function vistaEspecial() {
    if (sinAcceso) {
      return '<div class="centro"><h2>Este celular no tiene acceso</h2>' +
        '<p>En la laptop, abrí stream2tv, apretá Ctrl+W y escaneá el código con la cámara. Se hace una sola vez.</p></div>';
    }
    if (!s) return '<p class="cargando">Conectando con la laptop…</p>';
    if (!s.tvs.length && s.fase !== "buscando" && !s.canal) {
      return '<div class="centro"><h2>No encontré ninguna TV</h2>' +
        '<p>Revisá que esté prendida y en el mismo wifi. Si usás Kodi, abrilo antes de buscar.</p>' +
        '<button class="primario" type="button" data-accion="buscar">Buscar de nuevo</button></div>';
    }
    return null;
  }

  function render() {
    renderConexion();
    var especial = vistaEspecial();
    $("contenido").hidden = especial !== null;
    $("especial").hidden = especial === null;
    if (especial !== null) { poner("especial", especial); return; }

    if (!platForm) platForm = s.plataforma || "kick";
    if (!s.favoritos.length) editando = false;
    poner("ahora", tarjetaAhora());

    var enTV = EN_TV[s.fase];
    poner("favs", favoritosOrdenados().map(function (p) {
      var f = p.f, e = p.e;
      var actual = enTV && s.canal && mismoCanal(f.canal, s.canal) && f.plataforma === s.plataforma;
      var vivo = e && e.vivo;
      var der = editando ? '<span class="quitar">Quitar</span>'
        : actual ? '<span class="en-tv"><i></i>En la TV</span>'
        : vivo ? '<span class="vivos"><i></i>' + (espectadores(e.espectadores) || "En vivo") + '</span>'
        : e ? '<span class="offline">Offline</span>' : "<span></span>";
      var tit = vivo ? [e.categoria, e.titulo].filter(Boolean).join(" · ") : "";
      var clases = "fila" + (tit ? " con-titulo" : "") + (e && !vivo && !actual ? " off" : "");
      return '<button class="' + clases + '" type="button" data-fav="' + p.i + '"><span class="n">' + logo(f.plataforma, 18) +
        '<span>' + esc(nombreVisible(f.canal)) + (tit ? '<small class="tit">' + esc(tit) + '</small>' : "") + '</span></span>' + der + '</button>';
    }).join(""));
    var editar = $("btn-editar");
    editar.hidden = !s.favoritos.length;
    editar.textContent = editando ? "Listo" : "Editar";

    poner("logo-form", logo(platForm, 18));
    $("plat").value = platForm;
    $("btn-ir").disabled = !!(s.arrancando || ARRANCANDO[s.fase]);
    $("btn-buscar").textContent = s.fase === "buscando" ? "Buscando…" : "Buscar";

    poner("tvs", s.tvs.map(function (t) {
      var detalle = t.alias ? esc(t.original) + " · " + esc(t.ip) : esc(t.ip);
      return '<div class="fila-tv"><button class="tv-sel" type="button" data-tv="' + esc(t.udn) + '" aria-pressed="' + (t.udn === s.tv) + '">' +
        '<span class="n"><span>' + esc(t.nombre) + '<small>' + detalle + '</small></span></span>' +
        '<span class="check" aria-hidden="true">' + (t.udn === s.tv ? "✓" : "") + '</span></button>' +
        '<button class="lapiz" type="button" data-renombrar="' + esc(t.udn) + '" aria-label="Cambiar el nombre de ' + esc(t.nombre) + '">' +
        '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button></div>';
    }).join(""));
    renderLog();
  }

  document.getElementById("app").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || !s) return;
    var accion = b.dataset.accion;
    if (accion === "detener") return pedir("/api/detener");
    if (accion === "buscar") return pedir("/api/buscar-tvs");
    if (accion === "guardar") return pedir("/api/favoritos", { canal: s.canal, plataforma: s.plataforma });
    if (accion === "editar") { editando = !editando; render(); return; }
    if (b.dataset.renombrar) return abrirHoja(b.dataset.renombrar);
    if (b.dataset.tv) return pedir("/api/tv", { udn: b.dataset.tv });
    if (b.dataset.fav) {
      var f = s.favoritos[+b.dataset.fav];
      if (!f) return;
      if (editando) return pedir("/api/favoritos", { canal: f.canal, plataforma: f.plataforma });
      if (s.arrancando || ARRANCANDO[s.fase]) return;
      pedir("/api/reproducir", { canal: f.canal, plataforma: f.plataforma });
    }
  });

  // ---------- hoja para renombrar una TV ----------
  function abrirHoja(udn) {
    var tv = s.tvs.filter(function (t) { return t.udn === udn; })[0];
    if (!tv) return;
    hojaUdn = udn;
    $("hoja-sub").textContent = tv.original + " · " + tv.ip;
    var entrada = $("hoja-nombre");
    entrada.value = tv.alias || "";
    entrada.placeholder = tv.original;
    $("hoja-fabrica").hidden = !tv.alias;
    marcarSugerencia();
    $("velo").hidden = false;
    $("hoja").hidden = false;
    document.body.style.overflow = "hidden";
    // Dentro del toque del usuario: asi el celular abre el teclado.
    entrada.focus();
  }
  function cerrarHoja() {
    hojaUdn = null;
    $("hoja-nombre").blur();
    $("velo").hidden = true;
    $("hoja").hidden = true;
    document.body.style.overflow = "";
  }
  function marcarSugerencia() {
    var valor = $("hoja-nombre").value.trim().toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll(".sugerencia"), function (b) {
      b.classList.toggle("activa", b.textContent.toLowerCase() === valor);
    });
  }
  function guardarNombre(alias) {
    var udn = hojaUdn;
    if (!udn) return;
    pedir("/api/tv/nombre", { udn: udn, alias: alias }).then(function (r) {
      if (r && r.ok) cerrarHoja();
    });
  }
  $("hoja").addEventListener("submit", function (e) {
    e.preventDefault();
    guardarNombre($("hoja-nombre").value.trim());
  });
  $("hoja").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.classList.contains("sugerencia")) {
      $("hoja-nombre").value = b.textContent;
      marcarSugerencia();
      return;
    }
    if (b.dataset.hoja === "cancelar") return cerrarHoja();
    if (b.dataset.hoja === "fabrica") return guardarNombre("");
  });
  $("hoja-nombre").addEventListener("input", marcarSugerencia);
  $("velo").addEventListener("click", cerrarHoja);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && hojaUdn) cerrarHoja();
  });
  $("plat").addEventListener("change", function () { platForm = this.value; render(); });
  // La flecha aparece solo mientras hay algo escrito; Enter en el teclado tambien sirve.
  $("canal").addEventListener("input", function () { $("btn-ir").hidden = !this.value.trim(); });
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var entrada = $("canal");
    var canal = entrada.value.trim();
    if (!canal) { entrada.focus(); return; }
    pedir("/api/reproducir", { canal: canal, plataforma: platForm }).then(function (r) {
      if (r && r.ok) { entrada.value = ""; entrada.blur(); $("btn-ir").hidden = true; }
    });
  });

  function cargarEstado() {
    return fetch("/api/estado", { credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) { sinAcceso = true; render(); return null; }
      return r.json();
    }).then(function (datos) {
      if (!datos) return;
      sinAcceso = false;
      log = datos.log || [];
      delete datos.log;
      s = datos;
      render();
      escuchar();
    }).catch(function () { conectado = false; renderConexion(); setTimeout(cargarEstado, 3000); });
  }

  var fuente = null;
  function escuchar() {
    if (fuente) return;
    fuente = new EventSource("/api/eventos");
    fuente.addEventListener("open", function () { conectado = true; renderConexion(); });
    fuente.addEventListener("estado", function (e) { s = JSON.parse(e.data); conectado = true; render(); });
    fuente.addEventListener("log", function (e) {
      log.push(JSON.parse(e.data));
      if (log.length > 50) log.shift();
      if (s && !sinAcceso) renderLog();
    });
    fuente.addEventListener("error", function () {
      // EventSource reintenta solo; mientras tanto se muestra el corte.
      conectado = false;
      renderConexion();
    });
  }

  // Los minutos avanzan aunque no lleguen eventos.
  setInterval(function () { if (s && s.fase === "reproduciendo" && !sinAcceso) poner("ahora", tarjetaAhora()); }, 30000);
  cargarEstado();
})();
</script>
</body>
</html>
